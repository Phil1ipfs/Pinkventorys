<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" role="img" aria-label="A pink padlock with a shield and check mark">
  <defs>
    <linearGradient id="si-lock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8aa8"/>
      <stop offset="1" stop-color="#e3356a"/>
    </linearGradient>
    <linearGradient id="si-shackle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f9a3ba"/>
      <stop offset=".5" stop-color="#ffd3df"/>
      <stop offset="1" stop-color="#f27397"/>
    </linearGradient>
    <linearGradient id="si-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe1ea"/>
    </linearGradient>
  </defs>
  <circle cx="150" cy="128" r="104" fill="#fff" opacity=".18"/>
  <ellipse cx="160" cy="232" rx="118" ry="12" fill="#c93a64" opacity=".18"/>
  <!-- shackle -->
  <path d="M104 116V86a46 46 0 0 1 92 0v30" fill="none" stroke="url(#si-shackle)" stroke-width="22" stroke-linecap="round"/>
  <!-- lock body -->
  <rect x="76" y="108" width="148" height="120" rx="26" fill="url(#si-lock)"/>
  <rect x="88" y="118" width="124" height="22" rx="11" fill="#fff" opacity=".18"/>
  <!-- keyhole -->
  <circle cx="150" cy="160" r="14" fill="#a8214c"/>
  <path d="M143 166h14l4 30h-22z" fill="#a8214c"/>
  <!-- shield -->
  <g transform="translate(176 130)">
    <path d="M44 0l42 16v32c0 30-18 50-42 60C20 98 2 78 2 48V16z" fill="url(#si-shield)" stroke="#f7b7c9" stroke-width="3"/>
    <path d="M44 14l28 11v23c0 21-12 35-28 43-16-8-28-22-28-43V25z" fill="#ff8aa8" opacity=".35"/>
    <path d="M28 52l12 12 22-26" fill="none" stroke="#e3356a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- sparkles -->
  <g stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".95">
    <path d="M250 50l12-14"/><path d="M262 76l18-4"/><path d="M238 34l2-16"/>
  </g>
  <g fill="#fff">
    <circle cx="50" cy="70" r="5"/><circle cx="36" cy="150" r="3"/><circle cx="286" cy="128" r="3"/>
  </g>
</svg>
